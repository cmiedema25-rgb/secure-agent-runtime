[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agent-runtime"
version = "1.0.0"
description = "A zero-dependency, policy-enforced runtime and red-team harness for tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Charles Miedema" }
]
keywords = [
  "ai-safety",
  "red-teaming",
  "llm-agents",
  "prompt-injection",
  "python",
  "secure-runtime",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "ruff==0.16.5",
]

[project.scripts]
secure-agent = "secure_agent_runtime.cli:main"

[project.urls]
Repository = "https://github.com/cmiedema25-rgb/secure-agent-runtime"
Issues = "https://github.com/cmiedema25-rgb/secure-agent-runtime/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_agent_runtime = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S310"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["secure_agent_runtime"]
