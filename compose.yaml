services:
  secure-agent-runtime:
    build: .
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AUDIT_SIGNING_KEY: "${AUDIT_SIGNING_KEY:?set AUDIT_SIGNING_KEY}"
      RUNTIME_API_TOKEN: "${RUNTIME_API_TOKEN:?set RUNTIME_API_TOKEN}"
    volumes:
      - runtime-audit:/app/var
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  runtime-audit:
