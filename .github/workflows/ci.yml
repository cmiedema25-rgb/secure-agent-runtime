name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install '.[dev]'

      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
          mypy src/secure_agent_runtime

      - name: Compile all Python sources
        run: python -m compileall -q src tests examples

      - name: Run 83 unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run red-team regression benchmark
        run: >-
          python -m secure_agent_runtime
          --policy config/policy.toml
          evaluate
          --corpus evals/attack_corpus.jsonl
